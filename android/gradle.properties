org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -Djava.io.tmpdir=D:/gradle-tmp
android.useAndroidX=true
android.enableJetifier=true
# AGP 8.7 rəsmi olaraq compileSdk 35-ə qədər test edilib; 36-nı işlətmək üçün xəbərdarlığı susdururuq
android.suppressUnsupportedCompileSdk=36
# Redirect Gradle user home to D: drive (C: drive has no free space)
org.gradle.user.home=D:/gradle-home
