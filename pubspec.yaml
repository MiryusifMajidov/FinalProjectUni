name: chess_app
description: CheckMate — Online chess with multiplayer, tournaments, campaign mode, and bot play.
publish_to: 'none'
version: 1.1.0+8
# version format: major.minor.patch+buildNumber
# versionName = "1.0.0"  →  Play Store-da göstərilir
# versionCode = 1        →  hər yükləmədə +1 artırılmalıdır

environment:
  sdk: '>=3.7.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_database: ^11.1.4
  firebase_messaging: ^15.1.4
  firebase_storage: ^12.3.3

  # State Management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.6.2

  # UI & Fonts
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  phosphor_icons: ^3.0.1
  shimmer: ^3.0.0
  flutter_animate: ^4.5.0
  cached_network_image: ^3.4.1

  # Chess Logic + Engine
  chess: ^0.8.1
  http: ^1.2.2

  # SVG Piece Sets
  flutter_svg: ^2.0.10

  # Map
  flutter_map: ^7.0.2
  latlong2: ^0.9.0
  geolocator: ^13.0.2

  # Media
  image_picker: ^1.1.2

  # Utils
  shared_preferences: ^2.3.3
  connectivity_plus: ^6.1.0
  # flutter_localizations (easy_localization vasitəsilə gəlir) Flutter SDK-da
  # intl 0.20.2-yə pinlənib. ^0.19.0 qalsa `flutter pub get` HƏM burada, HƏM də
  # Codemagic-də (flutter: stable) version-solving xətası ilə düşür.
  # Kodda yalnız DateFormat('...').format(...) işlədilir — API 0.19→0.20 dəyişməyib.
  intl: ^0.20.2
  uuid: ^4.5.1
  equatable: ^2.0.7
  collection: ^1.18.0

  # Notifications
  flutter_local_notifications: ^18.0.1

  # Audio
  audioplayers: ^6.1.0

  # Security
  crypto: ^3.0.3
  cloud_functions: ^5.1.3

  # Google Sign-In
  google_sign_in: ^6.2.2

  # Sign in with Apple — mandatory on iOS because the app offers Google
  # Sign-In (App Store Review Guideline 4.8).
  sign_in_with_apple: ^6.1.4

  # Device / App info (sessions)
  device_info_plus: ^10.1.0
  package_info_plus: ^8.1.1

  # Share / export
  share_plus: ^10.1.3

  # Localization
  easy_localization: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
  # iOS App Store icons must be opaque
  remove_alpha_ios: true
  # Modern Android launchers: full-bleed dark background + safe-zone trio
  adaptive_icon_background: "#0A0A0B"
  adaptive_icon_foreground: "assets/images/app_icon_foreground.png"
  web:
    generate: true
    image_path: "assets/images/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/sounds/
    - assets/translations/
    - assets/pieces/cburnett/
    - assets/pieces/merida/
    - assets/pieces/alpha/
